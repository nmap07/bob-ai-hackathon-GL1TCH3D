services:
  emafig:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      BOB_MODE: ${BOB_MODE:-mock}
      BOB_BASE_URL: ${BOB_BASE_URL:-}
      BOB_API_KEY: ${BOB_API_KEY:-}
      BOB_MODEL: ${BOB_MODEL:-}
      BOB_CMD: ${BOB_CMD:-bob --chat-mode={mode} -p {prompt}}
      EMAFIG_UNIT_NAME: ${EMAFIG_UNIT_NAME:-}
      EMAFIG_UNIT_CONTACT: ${EMAFIG_UNIT_CONTACT:-}
      AASIST_MODEL: ${AASIST_MODEL:-models/audio/aasist.onnx}
    volumes:
      - ./cases:/app/cases
      - ./models:/app/models
