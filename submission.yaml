submission:
  title: "EMAFIG - Evidence-Centric Multi-Agent Forensic Investigation Graph"
  problem_statement: >
    Investigators and courts increasingly receive suspected deepfake video, image and
    audio as evidence, but most tools reduce the question to a single opaque
    "X% fake" classifier score. That score is not reproducible, hides benign
    explanations such as re-encoding, and cannot show how a conclusion was reached,
    which makes it hard to defend under cross-examination.
  solution_summary: >
    EMAFIG preserves the original file with SHA-256/SHA-512, runs seven deterministic
    forensic agents in parallel (metadata, compression, visual, audio, temporal,
    A/V sync, C2PA provenance), and turns their output into structured observations
    that each carry alternative explanations and limitations. IBM Bob then operates the
    case through an MCP server (13 bounded tools) and 14 project skills to reason over
    competing hypotheses, contradictions and evidence gaps, while a hash-chained
    audit ledger, human review and human sign-off keep the investigator in control.
  key_features:
    - "Immutable evidence intake with SHA-256/SHA-512 and an append-only, verifiable hash-chain audit ledger"
    - "Seven parallel forensic agents (image and video aware) emitting structured observations with alternative explanations and limitations"
    - "Competing-hypotheses model that includes benign post-processing, plus explicit contradictions and evidence-gap lists"
    - "IBM Bob integration via a local STDIO MCP server (13 tools) and 14 Bob skills covering the full investigation workflow"
    - "Human accept/reject review per observation, human sign-off, and JSON + Markdown forensic report generation"
  ibm_bob_usage: >
    IBM Bob is the operator/reasoning layer. Bob launches mcp_server.py from
    .bob/mcp.json and uses list_cases, get_observations, get_hypotheses,
    get_contradictions, verify_audit_ledger, review_observation, generate_report and
    sign_off_case to inspect, challenge and report on cases. Bob skills in
    .bob/skills define the staged workflow and the rules Bob must follow (no invented
    measurements, no invented legal sections, no real/fake verdict from a model score).
  known_limitations: >
    Detectors are uncalibrated screening heuristics, not a validated deepfake
    classifier; no trained visual model is wired in. The in-app Bob HTTP boundary defaults to a deterministic mock and is
    untested against a live gateway. core/plane_c is included but not yet wired into
    the runtime pipeline. See README.md for the full list.
